[package]
name = "pa-oh-typing-tutor"
version = "1.0.1"
description = "Offline Pa’O typing lessons for Windows and Ubuntu"
authors = ["Pa’O Typing Tutor"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Practice typing, follow lessons, take speed tests, and track your progress." />
    <title>Typing Tutor</title>
    <script>
      // Apply the saved appearance before the first paint.
      try {
        const saved = JSON.parse(localStorage.getItem('typing-tutor.unified-data.v2') || 'null');
        const dark = saved?.preferences?.darkMode === true;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1220' : '#f8fafc';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

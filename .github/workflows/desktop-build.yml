name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: ubuntu-x64
            bundle: deb
            extension: deb
          - os: windows-latest
            name: windows-x64
            bundle: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Ubuntu build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev build-essential patchelf
      - name: Install dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
      - name: Check frontend types and Rust formatting
        run: |
          pnpm --dir frontend typecheck
          pnpm --dir frontend exec vitest run src/features/simple --maxWorkers=1
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - name: Build installer
        run: pnpm --dir desktop build --bundles ${{ matrix.bundle }} -- --locked
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pa-oh-typing-tutor-${{ matrix.name }}
          path: desktop/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
